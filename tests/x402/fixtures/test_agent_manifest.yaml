metadata:
  name: test-paid-agent
  version: 1.0.0
  description: Test agent for x402 payment flow testing

payment:
  enabled: true
  scheme: exact
  networks:
    - base-sepolia
  price:
    amount: "10000"  # 0.01 USDC
    asset: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"  # USDC on Base Sepolia
    symbol: "USDC"
    decimals: 6
  payTo: "0xYourTestWalletAddress"
  description: "Test payment for agent execution"

runtime:
  model:
    provider: openai
    name: gpt-3.5-turbo
  temperature: 0.7
  max_tokens: 100
  config:
    system_prompt: "You are a test agent. Respond with 'Test successful' to any input."

