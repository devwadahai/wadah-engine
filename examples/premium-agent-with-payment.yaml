apiVersion: wadah.ai/v0.1
kind: Agent
metadata:
  name: premium-support-agent
  version: 1.0.0
  description: Premium AI customer support agent with GPT-4
  authors: ["Wadah Team"]
  tags: ["customer-support", "premium", "paid"]

runtime:
  model:
    provider: openai
    model_id: gpt-4
    params:
      temperature: 0.7
      max_tokens: 1000
  
  tools:
    - id: web_search
      type: function
      config:
        name: search
        enabled: true

# x402 Payment Configuration
payment:
  enabled: true
  scheme: exact
  networks:
    - base
    - ethereum
  price:
    amount: "10000"  # 0.01 USDC (6 decimals)
    asset: "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913"  # USDC on Base
    symbol: "USDC"
    decimals: 6
  payTo: "0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb"
  description: "Premium AI agent powered by GPT-4 with advanced customer support capabilities"

