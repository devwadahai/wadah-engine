apiVersion: wadah.ai/v0.1
kind: Agent
metadata:
  name: devops-copilot
  version: 0.1.0
  description: "AI-powered DevOps assistant for infrastructure and deployment tasks"
  authors: ["Wadah Team <team@wadah.ai>"]
  license: Apache-2.0
  tags:
    - devops
    - infrastructure
    - automation
    - kubernetes

runtime:
  model:
    provider: openai
    modelId: gpt-4o
    params:
      temperature: 0.2
      top_p: 0.9
      max_tokens: 8192
      seed: 1337

  tools:
    - id: kubectl
      type: process
      manifest: tools/kubectl.yaml
    - id: docker
      type: process
      manifest: tools/docker.yaml
    - id: git
      type: process
      manifest: tools/git.yaml
    - id: http
      type: http
      manifest: tools/http.yaml

  env:
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    KUBECONFIG: "${KUBECONFIG:-~/.kube/config}"

policy:
  toolcaps: ToolCaps.json
  
  budgets:
    tokens_per_minute: 300000
    usd_per_day: 100.0
    max_duration_secs: 1800

  network:
    allow_domains:
      - "api.openai.com"
      - "github.com"
      - "gitlab.com"
      - "*.kubernetes.io"
      - "docker.io"
      - "ghcr.io"

  filesystem:
    allow_paths:
      - "./workspace"
      - "~/.kube"
      - "~/.docker"
    deny_paths:
      - "/etc/passwd"
      - "/etc/shadow"
    read_only: false

artifacts:
  include:
    - "prompts/**"
    - "code/**"
    - "tools/**"
    - "scripts/**"
  exclude:
    - "**/*.log"
    - "**/node_modules/**"

