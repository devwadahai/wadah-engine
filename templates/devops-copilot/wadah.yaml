apiVersion: wadah.ai/v0.1
kind: Agent
metadata:
  name: devops-copilot
  version: 0.1.0
  description: "AI assistant for DevOps tasks - deployments, monitoring, troubleshooting"
  authors: ["Wadah Team"]
  license: Apache-2.0
  tags: [devops, kubernetes, ci-cd, monitoring]

runtime:
  model:
    provider: openai
    model_id: gpt-4o
    params:
      temperature: 0.2
      max_tokens: 2048

  tools:
    - name: kubectl
      description: "Kubernetes cluster management"
      config: tools/kubectl.json
    - name: github
      description: "GitHub API for CI/CD"
      config: tools/github.json
    - name: docker
      description: "Container management"
      config: tools/docker.json

  env:
    KUBECONFIG: /workspace/.kube/config
    GITHUB_TOKEN: ${GITHUB_TOKEN}

# Standard security for production DevOps
plugins:
  - id: security.toolcaps
    enabled: true
  - id: security.budgets
    enabled: true
    config:
      tokens_per_minute: 150000
      usd_per_day: 100.0
      max_duration_secs: 3600
  - id: security.network
    enabled: true
  - id: observability.tracing
    enabled: true

policy:
  toolcaps: ToolCaps.json
  budgets:
    tokens_per_minute: 150000
    usd_per_day: 100.0
    max_duration_secs: 3600
  network:
    allow_domains:
      - "api.github.com"
      - "*.k8s.io"
      - "docker.io"
      - "ghcr.io"
  filesystem:
    allow_paths:
      - "/workspace"
      - "/tmp"
    read_only: false

artifacts:
  include:
    - "prompts/**"
    - "tools/**"
    - "code/**"
